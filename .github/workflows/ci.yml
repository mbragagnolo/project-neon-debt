name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    # GitHub's default is 6 HOURS. A Godot run that fails to start hangs rather
    # than exiting (a bad engine/GUT pairing does exactly this), so an unbounded
    # job quietly eats the month's free minutes. The whole suite is well under a
    # minute of real work — 10 is already generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d /tmp
          mkdir -p ~/godot-bin
          mv "/tmp/${name}" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # Every step below caps the engine with `timeout` a little under its own
      # timeout-minutes, so a hang reports itself with a readable message
      # instead of showing up as a generic cancelled step.
      - name: Import assets
        working-directory: game
        timeout-minutes: 4
        run: |
          set -euo pipefail
          status=0
          timeout 180 godot --headless --path . --import || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::asset import hung and was killed after 3 minutes"
          fi
          exit "$status"

      - name: Run GUT test suite
        working-directory: game
        timeout-minutes: 5
        run: |
          set -euo pipefail
          status=0
          output=$(timeout 240 godot --headless --path . \
            -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json 2>&1) || status=$?
          echo "$output"
          # 124 is `timeout` killing it. GUT that cannot boot — an engine
          # upgrade, a broken addon — never reaches its own exit path, so this
          # distinguishes "the runner hung" from "a test failed".
          if [ "$status" -eq 124 ]; then
            echo "::error::the GUT runner hung and was killed after 4 minutes"
            exit 1
          fi
          # A test file that fails to parse is SKIPPED, not failed: GUT prints
          # "All tests passed" with the whole file missing from the run. Green
          # with silently less coverage than yesterday is worse than red, and
          # only the log says so.
          if grep -qE "Parse Error|Failed to load script|Compile Error" <<< "$output"; then
            echo "::error::a script failed to load — some tests never ran"
            exit 1
          fi
          exit "$status"

      - name: Boot the main scene
        working-directory: game
        timeout-minutes: 3
        run: |
          set -euo pipefail
          status=0
          output=$(timeout 120 godot --headless --path . --quit-after 120 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 124 ]; then
            echo "::error::the main scene hung on boot and was killed after 2 minutes"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the main scene exited with status $status"
            exit "$status"
          fi
          # --quit-after exits 0 even when scripts blew up, so read the log.
          if grep -qE "SCRIPT ERROR|ERROR:" <<< "$output"; then
            echo "::error::the main scene logged errors on boot"
            exit 1
          fi
